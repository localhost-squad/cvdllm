<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CVDLLM Secure Autonomous Banking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Google Sans', sans-serif; }</style>
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body class="bg-gray-50 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-bold text-gray-800">💬 CVDLLM Secure Autonomous Banking & TPM Audit</h1>
        <span class="text-xs bg-green-100 text-green-800 font-semibold px-3 py-1 rounded-full">Hardware TPM Active</span>
    </header>

    <!-- Main Content Grid -->
    <div class="flex-1 flex overflow-hidden p-6 gap-6">
        
        <!-- Left Panel: Chatbot -->
        <div class="flex-1 bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col overflow-hidden">
            <div id="chat-box" class="flex-1 p-6 overflow-y-auto space-y-4 bg-gray-50">
                <div class="flex flex-col">
                    <span class="font-bold text-xs text-gray-500 mb-1">System</span>
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 text-sm text-gray-700 max-w-lg">
                        Welcome! Secure banking assistant initialized with deterministic agent & TPM backing. Type a prompt below.
                    </div>
                </div>
            </div>
            
            <!-- Input Area -->
            <div class="p-4 bg-white border-t border-gray-200 flex gap-3">
                <input type="text" id="user-input" placeholder="Type a banking command..." 
                    class="flex-1 border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500">
                <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-xl text-sm transition">
                    Send
                </button>
            </div>
        </div>

        <!-- Right Panel: Portfolio & TPM Tamper Sandbox -->
        <div class="w-96 bg-white rounded-2xl shadow-sm border border-gray-200 p-6 flex flex-col space-y-5 overflow-y-auto">
            <div>
                <h2 class="font-bold text-gray-800 mb-2">📊 Live Portfolio</h2>
                <pre id="portfolio-view" class="bg-gray-50 p-3 rounded-xl text-xs font-mono text-gray-700 border border-gray-100">Loading...</pre>
            </div>

            <hr class="border-gray-100">

            <div>
                <h2 class="font-bold text-gray-800 mb-2">🔒 TPM Hardware Security</h2>
                <label class="text-xs font-bold text-gray-500">Latest SHA-256 Hash:</label>
                <input type="text" id="hash-field" readonly class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 text-xs font-mono text-gray-600 mt-1 mb-3">
                
                <label class="text-xs font-bold text-gray-500">TPM Signature (Editable for Tamper Test):</label>
                <textarea id="sig-field" rows="3" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 text-xs font-mono text-gray-600 mt-1 mb-3"></textarea>
                
                <button onclick="verifySig()" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2.5 rounded-xl text-xs transition mb-2">
                    Verify Signature Against TPM
                </button>
                <div id="status-box" class="text-xs font-bold text-gray-500">Status: Ready</div>
            </div>
        </div>
    </div>

    <script>
        async function loadPortfolio() {
            let p = await eel.get_portfolio_state()();
            document.getElementById('portfolio-view').innerText = 
                `Checking : $${p.checking.toLocaleString()}\nSavings  : $${p.savings.toLocaleString()}\n\n` +
                ` AAPL   : ${p.portfolio.AAPL} shares\n` +
                `🅂 SSNLF  : ${p.portfolio.SSNLF} shares\n` +
                `🅛 LNVGY  : ${p.portfolio.LNVGY} shares\n` +
                `🄗 HPQ    : ${p.portfolio.HPQ} shares`;
        }

        async function sendMessage() {
            let input = document.getElementById('user-input');
            let text = input.value.trim();
            if (!text) return;
            input.value = '';

            appendMsg('You', text, 'bg-blue-50 text-blue-900 ml-auto');
            
            let res = await eel.run_agent_prompt(text)();
            appendMsg('Assistant', res.reply, 'bg-gray-100 text-gray-900');
            
            if (res.hash) {
                document.getElementById('hash-field').value = res.hash;
                document.getElementById('sig-field').value = res.signature;
                let status = document.getElementById('status-box');
                status.innerText = "Status: 🔒 Signed & Verified by TPM";
                status.className = "text-xs font-bold text-green-700";
            }
            loadPortfolio();
        }

        function appendMsg(sender, text, css) {
            let box = document.getElementById('chat-box');
            box.innerHTML += `<div class="flex flex-col"><span class="font-bold text-xs text-gray-500 mb-1">${sender}</span><div class="p-3 rounded-xl shadow-sm border border-gray-100 text-sm max-w-lg ${css}">${text.replace(/\n/g, '<br>')}</div></div>`;
            box.scrollTop = box.scrollHeight;
        }

        async function verifySig() {
            let hash = document.getElementById('hash-field').value;
            let sig = document.getElementById('sig-field').value.trim();
            let isValid = await eel.verify_tpm_signature(hash, sig)();
            let status = document.getElementById('status-box');
            if (isValid === "true") {
                status.innerText = "Status: 🟢 VALID (TPM Verified)";
                status.className = "text-xs font-bold text-green-700";
            } else {
                status.innerText = "Status: 🔴 TAMPERED / INVALID";
                status.className = "text-xs font-bold text-red-600";
            }
        }

        window.onload = loadPortfolio;
    </script>
</body>
</html>
